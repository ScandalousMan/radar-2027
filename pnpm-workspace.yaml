# Configuration pnpm 12 (projet unique : aucune entrée `packages`, principe VII).

# Refuse l'installation avec une version de Node hors de `engines` (FR-001).
engineStrict: true

# Les pairs manquants sont installés automatiquement ; pas de `strictPeerDependencies`
# tant que certains plugins ESLint ne déclarent pas ESLint 10 (research.md R9).
autoInstallPeers: true
strictPeerDependencies: false

# Paquets trop récents pour le délai de publication minimal par défaut de pnpm,
# explicitement acceptés (versions épinglées de research.md).
minimumReleaseAgeExclude:
  - '@tailwindcss/node@4.3.5'
  - '@tailwindcss/oxide-android-arm64@4.3.5'
  - '@tailwindcss/oxide-darwin-arm64@4.3.5'
  - '@tailwindcss/oxide-darwin-x64@4.3.5'
  - '@tailwindcss/oxide-freebsd-x64@4.3.5'
  - '@tailwindcss/oxide-linux-arm-gnueabihf@4.3.5'
  - '@tailwindcss/oxide-linux-arm64-gnu@4.3.5'
  - '@tailwindcss/oxide-linux-arm64-musl@4.3.5'
  - '@tailwindcss/oxide-linux-x64-gnu@4.3.5'
  - '@tailwindcss/oxide-linux-x64-musl@4.3.5'
  - '@tailwindcss/oxide-wasm32-wasi@4.3.5'
  - '@tailwindcss/oxide-win32-arm64-msvc@4.3.5'
  - '@tailwindcss/oxide-win32-x64-msvc@4.3.5'
  - '@tailwindcss/oxide@4.3.5'
  - '@tailwindcss/postcss@4.3.5'
  - serve@14.2.7
  - tailwindcss@4.3.5

# Seuls ces paquets (binaires natifs) peuvent exécuter un script d'installation
# (`pnpm approve-builds`) ; tout autre script de dépendance est ignoré.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
