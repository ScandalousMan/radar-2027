  polarity: "-"
  status: draft
  author: claude
# Reformulation de `institutions-competences-retour-etat` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Une partie des compétences exercées par les collectivités locales doit revenir à l'État.
# Motif : « Revenir » présuppose un état antérieur ; « transférées » décrit la décision sans jugement.
- id: institutions-competences-retour-etat-v2
  text: "Certaines compétences actuellement exercées par les collectivités territoriales doivent être transférées à l'État."
  themes:
    - institutions
  polarity: "-"
  status: draft
  author: claude
