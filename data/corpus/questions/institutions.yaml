  author: claude
# Relecture du 2026-11-09 (adrien) : texte conservé, polarité à trancher en seconde passe (P!). Motif : La suppression d'une chambre ne correspond pas nécessairement à une concentration des pouvoirs sur l'exécutif ; la polarité − est à revoir.
- id: institutions-supprimer-senat
  text: Le Sénat doit être supprimé.
