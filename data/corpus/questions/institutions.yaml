    both-ends-defensible: true
# Reformulation de `institutions-autonomie-corse-constitution` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La Corse doit obtenir un statut d'autonomie inscrit dans la Constitution.
# Motif : « Obtenir » est une formulation orientée vers un résultat ; le texte doit énoncer directement la mesure institutionnelle.
- id: institutions-autonomie-corse-constitution-v2
  text: "La Constitution doit reconnaître un statut d'autonomie pour la Corse."
  themes:
    - institutions
  polarity: +
  status: draft
  author: claude
- id: institutions-pouvoirs-commissions-enquete
