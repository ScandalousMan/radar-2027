# Reformulation de `institutions-mandat-presidentiel-sept-ans` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le mandat présidentiel doit être porté à sept ans.
# Motif : La durée du mandat n'indique pas en elle-même une concentration des pouvoirs exécutifs ; la polarité − n'est pas justifiée par l'axe Institutions.
# P! : polarité ou thème à trancher en seconde passe.
- id: institutions-mandat-presidentiel-sept-ans-v2
  text: "La durée du mandat du président de la République doit être portée à sept ans."
  themes:
    - institutions
  polarity: "-"
  status: draft
  author: claude
- id: institutions-parlement-interventions-militaires
  text: Le Parlement doit approuver toute intervention militaire extérieure avant son déclenchement.
  themes:
    - institutions
    - defense
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `institutions-fusions-communes-obligatoires` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le nombre de communes doit être réduit par des fusions obligatoires.
# Motif : La fusion communale peut centraliser ou mutualiser ; elle ne mesure pas directement le partage des pouvoirs entre exécutif, Parlement et collectivités.
# P! : polarité ou thème à trancher en seconde passe.
- id: institutions-fusions-communes-obligatoires-v2
  text: "Les communes doivent être regroupées par des fusions obligatoires au-delà d'un seuil de population défini."
  themes:
    - institutions
  polarity: "-"
  status: draft
  author: claude
- id: institutions-proportionnelle-legislatives
  text: Les députés doivent être élus au scrutin proportionnel.
  themes:
    - institutions
