  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: institutions-autonomie-fiscale-collectivites
  text: Les collectivités locales doivent disposer d'une plus grande autonomie fiscale.
