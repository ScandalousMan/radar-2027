# Relecture du 2026-11-09 (adrien) : texte conservé, polarité à trancher en seconde passe (P!). Motif : La réduction du nombre de parlementaires ne signifie pas mécaniquement une concentration des pouvoirs sur l'exécutif ou l'État central ; item non positionnable sur l'axe tel qu'il est défini.
- id: institutions-reduire-nombre-parlementaires
