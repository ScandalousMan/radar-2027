# Reformulation de `transport-autoroutes-concedees` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les autoroutes doivent rester concédées à des sociétés privées.
# Motif : « Rester » présuppose le statu quo ; distinguer propriété des infrastructures et mode d'exploitation.
- id: transport-autoroutes-concedees-v2
  text: "L'exploitation des autoroutes doit continuer à être confiée à des sociétés privées dans le cadre de concessions."
  themes:
    - transport
  polarity: "-"
  status: draft
  author: claude
- id: transport-trains-de-nuit
  text: L'État doit financer l'ouverture de nouvelles lignes de trains de nuit.
  themes:
    - transport
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `transport-petites-lignes-maintenues` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les petites lignes ferroviaires doivent être maintenues même lorsqu'elles sont peu fréquentées.
# Motif : « Même lorsqu'elles sont peu fréquentées » laisse de côté le coût et le niveau de service ; préciser l'arbitrage mesuré.
- id: transport-petites-lignes-maintenues-v2
  text: "Les lignes ferroviaires régionales peu fréquentées doivent être maintenues même si leur exploitation nécessite une subvention publique."
  themes:
    - transport
  polarity: +
  status: draft
  author: claude
- id: transport-subventionner-fret-ferroviaire
  text: L'État doit subventionner le fret ferroviaire pour qu'il puisse concurrencer le transport routier.
  themes:
    - transport
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: transport-milliard-amenagements-cyclables
  text: L'État doit consacrer au moins un milliard d'euros par an aux aménagements cyclables.
  themes:
    - transport
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `transport-abonnement-national-unique` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Un abonnement national unique donnant accès aux trains régionaux et aux transports urbains doit être créé.
# Motif : « Donner accès » peut laisser croire à une couverture universelle ; préciser les réseaux couverts. Le tarif et les modalités ne sont pas définis.
- id: transport-abonnement-national-unique-v2
  text: "Un abonnement national unique doit permettre d'utiliser les trains régionaux et les réseaux de transports urbains participants."
  themes:
    - transport
  polarity: +
  status: draft
  author: claude
# Reformulation de `transport-sncf-entreprise-publique` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La SNCF doit rester une entreprise entièrement publique.
# Motif : « Rester » présuppose le statu quo ; préciser si l'on parle de l'entreprise, de ses filiales ou de l'ensemble du groupe.
- id: transport-sncf-entreprise-publique-v2
  text: "La SNCF doit être détenue intégralement par des entités publiques."
  themes:
    - transport
    - economie
  polarity: +
  status: draft
  author: claude
