# Reformulation de `transport-supprimer-controle-technique-motos` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le contrôle technique des deux-roues motorisés doit être supprimé.
# Motif : Préciser qu'il s'agit du contrôle périodique obligatoire, et non de tout contrôle de sécurité.
