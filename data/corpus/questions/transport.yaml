# Reformulation de `transport-voitures-centres-villes-libres` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'accès des voitures aux centres-villes doit rester libre.
# Motif : « Rester libre » est vague et peut être compris comme absence de toute règle, y compris piétonnisation ou zones réglementées.
- id: transport-voitures-centres-villes-libres-v2
  text: "L'accès des voitures particulières aux centres-villes ne doit pas être soumis à des restrictions générales de circulation."
  themes:
    - transport
  polarity: "-"
  status: draft
  author: claude
