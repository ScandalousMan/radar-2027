# Reformulation de `agriculture-bio-restauration-collective` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La part des produits biologiques dans la restauration collective publique doit être portée à 30 %.
# Motif : Préciser si le pourcentage porte sur la valeur des achats, le volume ou le nombre de produits.
- id: agriculture-bio-restauration-collective-v2
  text: "Les produits issus de l'agriculture biologique doivent représenter au moins 30 % des achats alimentaires de la restauration collective publique."
  themes:
    - agriculture
  polarity: +
  status: draft
  author: claude
