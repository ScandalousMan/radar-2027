# Reformulation de `agriculture-prix-plancher-agricoles` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Des prix plancher garantis doivent être fixés pour les principales productions agricoles.
# Motif : « Principales productions » est indéfini ; « prix plancher » est un terme de politique publique acceptable mais « prix minimaux garantis » est plus accessible.
- id: agriculture-prix-plancher-agricoles-v2
  text: "Des prix minimaux garantis doivent être fixés pour certaines productions agricoles."
  themes:
    - agriculture
  polarity: +
  status: draft
  author: claude
- id: agriculture-retenues-eau-irrigation
