# Banque de questions, thème principal « agriculture » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: agriculture-pesticides-moitie-2030
  text: L'usage des pesticides de synthèse doit être réduit de moitié d'ici 2030.
  themes:
    - agriculture
    - environnement
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
