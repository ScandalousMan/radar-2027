# Reformulation de `agriculture-origine-viandes-restaurants` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'origine des viandes doit être obligatoirement indiquée dans les plats servis par les restaurants.
# Motif : Le terme « origine » doit être défini (pays d'élevage, d'abattage, lieu de transformation) pour éviter des interprétations divergentes.
- id: agriculture-origine-viandes-restaurants-v2
  text: "Les restaurants doivent indiquer l'origine des viandes utilisées dans les plats qu'ils servent."
  themes:
    - agriculture
  polarity: +
  status: draft
  author: claude
