- id: agriculture-pesticides-moitie-2030
  text: L'usage des pesticides de synthèse doit être réduit de moitié d'ici 2030.
  themes:
    - agriculture
    - environnement
  polarity: +
  status: draft
  author: claude
- id: agriculture-alleger-normes-agricoles
  text: Les normes environnementales imposées aux agriculteurs français doivent être allégées.
  themes:
    - agriculture
  polarity: "-"
  status: draft
  author: claude
- id: agriculture-prix-plancher-agricoles
  text: Des prix plancher garantis doivent être fixés pour les principales productions agricoles.
  themes:
    - agriculture
  polarity: +
  status: draft
  author: claude
- id: agriculture-retenues-eau-irrigation
  text: La construction de retenues d'eau pour l'irrigation doit être facilitée.
  themes:
    - agriculture
  polarity: "-"
  status: draft
  author: claude
- id: agriculture-bio-restauration-collective
  text: La part des produits biologiques dans la restauration collective publique doit être portée à 30 %.
  themes:
    - agriculture
  polarity: +
  status: draft
  author: claude
- id: agriculture-agrandissement-sans-autorisation
  text: Les exploitations agricoles doivent pouvoir s'agrandir sans autorisation administrative.
  themes:
    - agriculture
  polarity: "-"
  status: draft
  author: claude
