# Reformulation de `agriculture-chalut-aires-protegees` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La pêche au chalut de fond doit être interdite dans les aires marines protégées.
# Motif : « Aires marines protégées » recouvre des niveaux de protection différents ; préciser si l'interdiction concerne toutes les catégories.
- id: agriculture-chalut-aires-protegees-v2
  text: "La pêche au chalut de fond doit être interdite dans les zones marines bénéficiant d'un statut de protection."
  themes:
    - agriculture
    - environnement
  polarity: +
  status: draft
  author: claude
# Reformulation de `agriculture-autoriser-nouvelles-techniques-genomiques` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La culture de plantes issues des nouvelles techniques génomiques doit être autorisée en France.
# Motif : Le terme technique est peu connu et les positions publiques varient selon les techniques et leur encadrement ; ajouter une définition courte dans l'interface.
- id: agriculture-autoriser-nouvelles-techniques-genomiques-v2
  text: "La culture en France de plantes obtenues par de nouvelles techniques génomiques doit être autorisée sous un régime spécifique."
  themes:
    - agriculture
  polarity: "-"
  status: draft
  author: claude
