# Reformulation de `agriculture-tirs-loups-sans-autorisation` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les éleveurs doivent pouvoir abattre sans autorisation préalable un loup qui attaque leur troupeau.
# Motif : « Sans autorisation préalable » peut être compris comme absence de toute condition ou contrôle ; préciser les circonstances et obligations de signalement.
- id: agriculture-tirs-loups-sans-autorisation-v2
  text: "Un éleveur doit pouvoir abattre un loup attaquant son troupeau sans autorisation administrative préalable."
  themes:
    - agriculture
    - environnement
  polarity: "-"
  status: draft
  author: claude
# Reformulation de `agriculture-curage-fosses-sans-autorisation` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les agriculteurs doivent pouvoir curer les fossés et les cours d'eau sans autorisation préalable.
# Motif : L'item combine fossés et cours d'eau, qui ne relèvent pas nécessairement des mêmes règles ; « curer » est technique et le champ d'application doit être borné.
- id: agriculture-curage-fosses-sans-autorisation-v2
  text: "Les agriculteurs doivent pouvoir entretenir les fossés agricoles sans autorisation préalable, dans le respect des règles de protection des cours d'eau."
  themes:
    - agriculture
  polarity: "-"
  status: draft
  author: claude
