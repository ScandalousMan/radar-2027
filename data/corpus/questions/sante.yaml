# Reformulation de `sante-doubler-etudiants-medecine` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le nombre d'étudiants admis en deuxième année de médecine doit être doublé.
# Motif : « Nombre d'étudiants admis » dépend d'une année de référence absente ; doubler est une mesure forte à dater.
- id: sante-doubler-etudiants-medecine-v2
  text: "Le nombre de places ouvertes en deuxième année des études de médecine doit être doublé par rapport à une année de référence précisée."
  themes:
    - sante
  polarity: +
  status: draft
  author: claude
