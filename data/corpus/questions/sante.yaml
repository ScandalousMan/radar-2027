# Reformulation de `sante-mutuelles-part-accrue` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les mutuelles doivent prendre en charge une part plus importante des dépenses de santé, à la place de l'Assurance maladie.
# Motif : La version initiale combine hausse de prise en charge et substitution institutionnelle ; le transfert de financement est le point mesuré.
- id: sante-mutuelles-part-accrue-v2
  text: "Les complémentaires santé doivent prendre en charge une part plus importante des dépenses actuellement remboursées par l'Assurance maladie."
  themes:
    - sante
  polarity: "-"
  status: draft
  author: claude
# Reformulation de `sante-jeunes-medecins-zones-sous-dotees` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les jeunes médecins doivent exercer au moins deux ans dans une zone sous-dotée à la fin de leurs études.
# Motif : La durée de deux ans et le moment d'application sont des paramètres de mesure ; la formulation actuelle présente une obligation très précise sans définir les zones.
- id: sante-jeunes-medecins-zones-sous-dotees-v2
  text: "Les médecins nouvellement diplômés doivent exercer pendant une durée déterminée dans un territoire identifié comme sous-doté."
  themes:
    - sante
  polarity: +
  status: draft
  author: claude
- id: sante-ratios-soignants-patients
