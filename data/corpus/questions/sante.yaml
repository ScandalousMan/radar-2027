# Banque de questions, thème principal « sante » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

# Reformulation de `sante-regulation-installation-medecins` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'installation des médecins doit être régulée dans les zones déjà bien dotées.
# Motif : « Zones déjà bien dotées » est relatif ; préciser l'indicateur ou la référence territoriale.
- id: sante-regulation-installation-medecins-v2
  text: "L'installation de nouveaux médecins doit être soumise à des règles de répartition dans les zones où l'offre médicale est déjà élevée."
  themes:
    - sante
  polarity: +
  status: draft
  author: claude
- id: sante-depassements-honoraires-libres
  text: Les médecins doivent rester libres de pratiquer des dépassements d'honoraires.
  themes:
