# Reformulation de `economie-plafonner-prix-alimentaires` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les prix des produits alimentaires de première nécessité doivent être plafonnés par l'État.
# Motif : La catégorie « produits de première nécessité » doit être définie dans l'interface ou dans une note ; le périmètre conditionne fortement l'opinion.
- id: economie-plafonner-prix-alimentaires-v2
  text: "Les prix de certains produits alimentaires de première nécessité doivent être plafonnés par l'État."
  themes:
    - economie
  polarity: +
  status: draft
  author: claude
# Reformulation de `economie-encadrer-marges-distribution` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les marges de la grande distribution doivent être encadrées par la loi.
# Motif : « Encadrées » peut désigner de nombreux mécanismes ; « plafonnées » mesure une intervention plus précise. Vérifier que c'est bien la mesure visée.
- id: economie-encadrer-marges-distribution-v2
  text: "Les marges commerciales de la grande distribution doivent être plafonnées par la loi."
  themes:
    - economie
    - agriculture
  polarity: +
  status: draft
  author: claude
# Reformulation de `economie-etat-finance-usines` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'État doit financer directement la construction d'usines dans les secteurs qu'il juge prioritaires.
# Motif : « Qu'il juge prioritaires » laisse le périmètre entièrement indéterminé ; la question reste défendable mais nécessite une définition des secteurs.
- id: economie-etat-finance-usines-v2
  text: "L'État doit financer directement la construction d'usines dans des secteurs définis comme prioritaires."
  themes:
    - economie
  polarity: +
  status: draft
  author: claude
