# Banque de questions, thème principal « economie » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

# Reformulation de `economie-participations-etat-industrie` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'État doit prendre des participations dans les entreprises industrielles jugées stratégiques.
# Motif : « Jugées stratégiques » ne précise ni les critères ni l'autorité de jugement ; expliciter le périmètre si la question doit mesurer une préférence stable.
- id: economie-participations-etat-industrie-v2
  text: "L'État doit prendre des participations dans des entreprises industrielles appartenant à des secteurs définis comme stratégiques."
  themes:
    - economie
  polarity: +
  status: draft
  author: claude
- id: economie-alleger-regles-entreprises
