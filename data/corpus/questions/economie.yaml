# Reformulation de `economie-aides-conditionnees-emploi` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les aides publiques aux entreprises doivent être conditionnées au maintien de l'emploi en France.
# Motif : « Maintien de l'emploi » ne dit pas s'il s'agit des effectifs, des sites ou de l'emploi net ; le libellé proposé reste général mais évite de promettre une garantie absolue.
- id: economie-aides-conditionnees-emploi-v2
  text: "Les aides publiques aux entreprises doivent être conditionnées à des engagements de maintien de l'emploi en France."
  themes:
    - economie
    - travail
  polarity: +
  status: draft
  author: claude
# Reformulation de `economie-ouverture-dimanche-libre` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'ouverture des commerces le dimanche doit être libre.
# Motif : « Libre » est trop vague : il peut désigner l'absence de règle, de compensation ou de restriction locale.
- id: economie-ouverture-dimanche-libre-v2
  text: "Les commerces doivent pouvoir ouvrir le dimanche sans autorisation dérogatoire spécifique."
  themes:
    - economie
  polarity: "-"
  status: draft
  author: claude
