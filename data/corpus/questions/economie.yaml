# Banque de questions, thème principal « economie » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: economie-participations-etat-industrie
  text: L'État doit prendre des participations dans les entreprises industrielles jugées stratégiques.
  themes:
    - economie
  polarity: +
  status: draft
  author: claude
- id: economie-alleger-regles-entreprises
  text: Les règles encadrant la création et la gestion des entreprises doivent être allégées.
  themes:
    - economie
  polarity: "-"
  status: draft
  author: claude
- id: economie-prix-energie-reglementes
  text: Les prix de l'énergie pour les ménages doivent être réglementés par l'État.
  themes:
    - economie
    - environnement
  polarity: +
  status: draft
  author: claude
- id: economie-baisse-depense-publique
  text: La dépense publique doit baisser en proportion du PIB au cours du prochain quinquennat.
  themes:
    - economie
  polarity: "-"
  status: draft
  author: claude
- id: economie-aides-conditionnees-emploi
  text: Les aides publiques aux entreprises doivent être conditionnées au maintien de l'emploi en France.
  themes:
    - economie
    - travail
  polarity: +
  status: draft
  author: claude
- id: economie-ouverture-dimanche-libre
  text: L'ouverture des commerces le dimanche doit être libre.
  themes:
    - economie
  polarity: "-"
  status: draft
  author: claude
- id: economie-edf-entierement-publique
  text: EDF doit rester une entreprise entièrement détenue par l'État.
  themes:
    - economie
  polarity: +
  status: draft
  author: claude
- id: economie-controle-rachats-etrangers
  text: Le contrôle de l'État sur le rachat d'entreprises françaises par des investisseurs étrangers doit être renforcé.
  themes:
    - economie
  polarity: +
  status: draft
  author: claude
- id: economie-plafonner-prix-alimentaires
  text: Les prix des produits alimentaires de première nécessité doivent être plafonnés par l'État.
  themes:
    - economie
  polarity: +
  status: draft
  author: claude
- id: economie-encadrer-marges-distribution
  text: Les marges de la grande distribution doivent être encadrées par la loi.
  themes:
    - economie
    - agriculture
  polarity: +
  status: draft
  author: claude
- id: economie-etat-finance-usines
  text: L'État doit financer directement la construction d'usines dans les secteurs qu'il juge prioritaires.
  themes:
    - economie
  polarity: +
  status: draft
  author: claude
- id: economie-vendre-participations-etat
  text: L'État doit vendre une partie de ses participations dans les entreprises cotées en bourse.
  themes:
    - economie
  polarity: "-"
  status: draft
  author: claude
- id: economie-regle-equilibre-constitution
  text: Une règle d'équilibre des comptes publics doit être inscrite dans la Constitution.
  themes:
    - economie
    - institutions
  polarity: "-"
  status: draft
  author: claude
- id: economie-reduire-nombre-fonctionnaires
  text: Le nombre de fonctionnaires doit diminuer au cours du prochain quinquennat.
  themes:
    - economie
  polarity: "-"
  status: draft
  author: claude
- id: economie-supprimer-agences-etat
  text: Une partie des agences et opérateurs de l'État doit être supprimée.
  themes:
    - economie
  polarity: "-"
  status: draft
  author: claude
- id: economie-accords-libre-echange
  text: L'Union européenne doit conclure davantage d'accords de libre-échange.
  themes:
    - economie
    - international
  polarity: "-"
  status: draft
  author: claude
- id: economie-assouplir-seuils-effectifs
  text: Les obligations liées aux seuils d'effectifs des entreprises doivent être assouplies.
  themes:
    - economie
    - travail
  polarity: "-"
  status: draft
  author: claude
