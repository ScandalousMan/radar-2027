# Reformulation de `travail-smic-regional` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le SMIC doit pouvoir varier selon les régions.
# Motif : La variation territoriale du SMIC n'est pas nécessairement une baisse des protections collectives ; la polarité − est plausible mais ne découle pas mécaniquement de l'axe Travail.
# P! : polarité ou thème à trancher en seconde passe.
- id: travail-smic-regional-v2
  text: "Le montant du salaire minimum légal doit pouvoir varier selon les régions."
  themes:
    - travail
  polarity: "-"
  status: draft
  author: claude
# Reformulation de `travail-statut-fonction-publique-regalien` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le statut de fonctionnaire doit être réservé aux missions régaliennes de l'État.
# Motif : « Missions régaliennes » est une catégorie large et contestable ; une note explicative ou une liste d'exemples est nécessaire.
- id: travail-statut-fonction-publique-regalien-v2
  text: "Le statut de fonctionnaire titulaire doit être réservé aux emplois correspondant aux missions régaliennes de l'État."
  themes:
    - travail
  polarity: "-"
  status: draft
  author: claude
