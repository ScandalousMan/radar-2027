# Reformulation de `travail-limiter-licenciements-beneficiaires` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les entreprises bénéficiaires doivent être limitées dans leur recours aux licenciements économiques.
# Motif : « Bénéficiaires » ne précise pas de quelles aides ; « limitées dans leur recours » ne définit pas la contrainte.
- id: travail-limiter-licenciements-beneficiaires-v2
  text: "Les entreprises ayant reçu des aides publiques doivent être soumises à des restrictions concernant les licenciements économiques."
  themes:
    - travail
  polarity: +
  status: draft
  author: claude
# Reformulation de `travail-plafond-prudhommes-maintenu` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le plafond des indemnités prud'homales en cas de licenciement abusif doit être maintenu.
# Motif : « Licenciement abusif » est une expression courante mais juridiquement imprécise ; « maintenu » présuppose le statu quo.
- id: travail-plafond-prudhommes-maintenu-v2
  text: "Le barème légal plafonnant les indemnités accordées par les prud'hommes en cas de licenciement sans cause réelle et sérieuse doit être maintenu."
  themes:
    - travail
  polarity: "-"
  status: draft
  author: claude
