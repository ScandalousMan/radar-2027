# Reformulation de `travail-plafonner-ecart-salaires` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'écart entre les salaires les plus élevés et les plus bas d'une même entreprise doit être plafonné par la loi.
# Motif : Préciser si la comparaison porte sur salaire brut, rémunération totale et temps plein équivalent.
- id: travail-plafonner-ecart-salaires-v2
  text: "La loi doit fixer un écart maximal entre la rémunération la plus élevée et la plus faible au sein d'une même entreprise."
  themes:
    - travail
  polarity: +
  status: draft
  author: claude
# Reformulation de `travail-salaries-conseils-administration` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les salariés doivent occuper au moins un tiers des sièges des conseils d'administration des grandes entreprises.
# Motif : « Grandes entreprises » n'est pas défini ; le seuil d'effectif est nécessaire pour rendre la mesure opératoire.
- id: travail-salaries-conseils-administration-v2
  text: "Les salariés doivent occuper au moins un tiers des sièges des conseils d'administration des sociétés dépassant un seuil d'effectif défini."
  themes:
    - travail
    - economie
  polarity: +
  status: draft
  author: claude
