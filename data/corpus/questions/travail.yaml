# Banque de questions, thème principal « travail » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: travail-retraite-62-ans
  text: L'âge légal de départ à la retraite doit être ramené à 62 ans.
  themes:
    - travail
  polarity: +
  status: draft
  author: claude
- id: travail-durcir-indemnisation-chomage
  text: Les règles d'indemnisation du chômage doivent être durcies.
  themes:
    - travail
  polarity: "-"
  status: draft
  author: claude
- id: travail-smic-au-dela-inflation
  text: Le SMIC doit être augmenté au-delà de l'inflation.
  themes:
    - travail
    - economie
  polarity: +
  status: draft
  author: claude
- id: travail-duree-travail-accord-entreprise
  text: La durée légale du travail doit pouvoir être fixée par accord d'entreprise au-delà de 35 heures.
  themes:
    - travail
  polarity: "-"
  status: draft
  author: claude
- id: travail-limiter-licenciements-beneficiaires
  text: Les entreprises bénéficiaires doivent être limitées dans leur recours aux licenciements économiques.
  themes:
    - travail
  polarity: +
  status: draft
  author: claude
- id: travail-plafond-prudhommes-maintenu
  text: Le plafond des indemnités prud'homales en cas de licenciement abusif doit être maintenu.
  themes:
    - travail
  polarity: "-"
  status: draft
  author: claude
- id: travail-semaine-32-heures
  text: La durée légale du travail doit être réduite à 32 heures par semaine.
  themes:
    - travail
  polarity: +
  status: draft
  author: claude
- id: travail-indexation-salaires
  text: Les salaires doivent être indexés automatiquement sur l'inflation.
  themes:
    - travail
    - economie
  polarity: +
  status: draft
  author: claude
- id: travail-plafonner-ecart-salaires
  text: L'écart entre les salaires les plus élevés et les plus bas d'une même entreprise doit être plafonné par la loi.
  themes:
    - travail
  polarity: +
  status: draft
  author: claude
- id: travail-salaries-conseils-administration
  text: Les salariés doivent occuper au moins un tiers des sièges des conseils d'administration des grandes entreprises.
  themes:
    - travail
    - economie
  polarity: +
  status: draft
  author: claude
- id: travail-elargir-penibilite-retraite
  text: Les critères de pénibilité ouvrant droit à un départ anticipé à la retraite doivent être élargis.
  themes:
    - travail
  polarity: +
  status: draft
  author: claude
- id: travail-plateformes-presomption-salariat
  text: Les travailleurs des plateformes numériques doivent être présumés salariés.
  themes:
    - travail
    - numerique
  polarity: +
  status: draft
  author: claude
- id: travail-retraite-au-dela-64-ans
  text: L'âge légal de départ à la retraite doit être porté au-delà de 64 ans.
  themes:
    - travail
  polarity: "-"
  status: draft
  author: claude
- id: travail-retraite-capitalisation
  text: Une part des retraites doit être financée par capitalisation.
  themes:
    - travail
  polarity: "-"
  status: draft
  author: claude
- id: travail-augmenter-jours-carence
  text: Le nombre de jours de carence en cas d'arrêt maladie doit être augmenté.
  themes:
    - travail
    - sante
  polarity: "-"
  status: draft
  author: claude
- id: travail-smic-regional
  text: Le SMIC doit pouvoir varier selon les régions.
  themes:
    - travail
  polarity: "-"
  status: draft
  author: claude
- id: travail-statut-fonction-publique-regalien
  text: Le statut de fonctionnaire doit être réservé aux missions régaliennes de l'État.
  themes:
    - travail
  polarity: "-"
  status: draft
  author: claude
