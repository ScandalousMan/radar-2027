# Banque de questions, thème principal « international » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: international-majorite-qualifiee-ue
  text: La France doit accepter que davantage de décisions soient prises à la majorité qualifiée au sein de l'Union européenne.
  themes:
    - international
  polarity: +
  status: draft
  author: claude
- id: international-primaute-loi-nationale
  text: La France doit pouvoir appliquer sa loi nationale lorsqu'elle entre en conflit avec une règle européenne.
  themes:
    - international
    - institutions
  polarity: "-"
  status: draft
  author: claude
- id: international-aide-developpement-0-7
  text: L'aide publique au développement doit atteindre 0,7 % du revenu national brut.
  themes:
    - international
  polarity: +
  status: draft
  author: claude
- id: international-quitter-commandement-otan
  text: La France doit quitter le commandement intégré de l'OTAN.
  themes:
    - international
    - defense
  polarity: "-"
  status: draft
  author: claude
- id: international-emprunt-commun-ue
  text: L'Union européenne doit pouvoir emprunter en commun pour financer des investissements.
  themes:
    - international
  polarity: +
  status: draft
  author: claude
- id: international-reduire-contribution-ue
  text: La contribution de la France au budget de l'Union européenne doit être réduite.
  themes:
    - international
  polarity: "-"
  status: draft
  author: claude
- id: international-adhesion-ukraine-ue
  text: L'Ukraine doit pouvoir adhérer à l'Union européenne.
  themes:
    - international
  polarity: +
  status: draft
  author: claude
- id: international-listes-transnationales
  text: Une partie des députés européens doit être élue sur des listes transnationales.
  themes:
    - international
    - democratie
  polarity: +
  status: draft
  author: claude
- id: international-impots-propres-ue
  text: L'Union européenne doit disposer de nouveaux impôts qui lui sont propres.
  themes:
    - international
    - fiscalite
  polarity: +
  status: draft
  author: claude
- id: international-casques-bleus
  text: La France doit augmenter sa participation aux missions de maintien de la paix de l'ONU.
  themes:
    - international
    - defense
  polarity: +
  status: draft
  author: claude
- id: international-initiative-parlement-europeen
  text: Le Parlement européen doit obtenir le droit d'initiative législative.
  themes:
    - international
    - institutions
  polarity: +
  status: draft
  author: claude
- id: international-referendum-traites-europeens
  text: Tout nouveau traité européen doit être soumis à référendum en France.
  themes:
    - international
    - democratie
  polarity: "-"
  status: draft
  author: claude
- id: international-quitter-ue
  text: La France doit quitter l'Union européenne.
  themes:
    - international
  polarity: "-"
  status: draft
  author: claude
- id: international-quitter-euro
  text: La France doit quitter la zone euro.
  themes:
    - international
    - economie
  polarity: "-"
  status: draft
  author: claude
- id: international-controles-frontieres-schengen
  text: La France doit rétablir durablement des contrôles à toutes ses frontières intérieures de l'espace Schengen.
  themes:
    - international
    - immigration
  polarity: "-"
  status: draft
  author: claude
- id: international-lever-sanctions-russie
  text: Les sanctions de l'Union européenne contre la Russie doivent être levées.
  themes:
    - international
  polarity: "-"
  status: draft
  author: claude
- id: international-quitter-cedh
  text: La France doit se retirer de la Convention européenne des droits de l'homme.
  themes:
    - international
