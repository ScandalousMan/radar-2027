# Reformulation de `international-adhesion-ukraine-ue` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'Ukraine doit pouvoir adhérer à l'Union européenne.
# Motif : « Pouvoir adhérer » ne précise ni le processus ni le calendrier ; l'ouverture de négociations est une décision politique plus précisément identifiable.
