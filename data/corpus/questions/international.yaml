# Reformulation de `international-arrets-cedh-derogation` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La France doit pouvoir s'affranchir de certains arrêts de la Cour européenne des droits de l'homme.
# Motif : « S'affranchir » est connoté ; préciser si l'on parle de non-exécution d'arrêts, sans confondre la CEDH avec l'Union européenne.
- id: international-arrets-cedh-derogation-v2
