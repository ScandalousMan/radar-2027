# Banque de questions, thème principal « international » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: international-majorite-qualifiee-ue
  text: La France doit accepter que davantage de décisions soient prises à la majorité qualifiée au sein de l'Union européenne.
  themes:
    - international
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `international-primaute-loi-nationale` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La France doit pouvoir appliquer sa loi nationale lorsqu'elle entre en conflit avec une règle européenne.
# Motif : La formulation actuelle ne distingue pas conflit avec la Constitution et conflit avec une loi ordinaire ; elle laisse croire qu'une loi nationale peut écarter librement le droit de l'UE.
- id: international-primaute-loi-nationale-v2
  text: "La France doit pouvoir ne pas appliquer une règle de l'Union européenne lorsqu'elle est incompatible avec une disposition de sa Constitution."
  themes:
    - international
    - institutions
  polarity: "-"
  status: draft
  author: claude
