# Banque de questions, thème principal « democratie » (FR-008 à FR-012).
# Première tranche en brouillon (draft) : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: democratie-referendum-initiative-citoyenne
  text: Un référendum d'initiative citoyenne doit pouvoir être déclenché par une pétition signée par un nombre fixé d'électeurs.
  themes:
    - democratie
  polarity: +
  status: draft
  author: adrien
- id: democratie-referendum-exceptionnel
  text: Le recours au référendum doit rester exceptionnel.
  themes:
    - democratie
  polarity: "-"
  status: draft
  author: adrien
- id: democratie-conventions-citoyennes
  text: Des conventions citoyennes tirées au sort doivent être consultées avant les grandes réformes.
  themes:
    - democratie
  polarity: +
  status: draft
  author: adrien
- id: democratie-assemblees-tirees-consultatives
  text: Les assemblées citoyennes tirées au sort doivent conserver un rôle uniquement consultatif.
  themes:
    - democratie
  polarity: "-"
  status: draft
  author: adrien
- id: democratie-vote-blanc-exprime
  text: Le vote blanc doit être pris en compte dans les suffrages exprimés.
  themes:
    - democratie
  polarity: +
  status: draft
  author: adrien
- id: democratie-referendum-reserve-elus
  text: La décision de convoquer un référendum doit rester réservée au président de la République et au Parlement.
  themes:
    - democratie
    - institutions
  polarity: "-"
  status: draft
  author: adrien
