  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: democratie-supprimer-cese
  text: Le Conseil économique, social et environnemental doit être supprimé.
  themes:
    - democratie
    - institutions
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `democratie-seuil-rip-maintenu` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le référendum d'initiative partagée doit continuer d'exiger le soutien d'un dixième des électeurs inscrits.
# Motif : « Continuer d'exiger » présuppose le maintien du droit actuel ; la reformulation isole le seuil. Vérifier la cohérence juridique du seuil avant publication.
- id: democratie-seuil-rip-maintenu-v2
  text: "Le seuil de soutien d'un dixième des électeurs inscrits doit être maintenu pour déclencher un référendum d'initiative partagée."
  themes:
    - democratie
  polarity: "-"
  status: draft
  author: claude
# Reformulation de `democratie-parrainages-elus-maintenus` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les candidats à l'élection présidentielle doivent continuer à recueillir 500 parrainages d'élus.
# Motif : « Continuer » présuppose le statu quo ; « présentations » est le terme juridique usuel à privilégier.
- id: democratie-parrainages-elus-maintenus-v2
  text: "L'accès à l'élection présidentielle doit rester conditionné à l'obtention de 500 présentations d'élus."
  themes:
    - democratie
  polarity: "-"
  status: draft
  author: claude
# Reformulation de `democratie-raccourcir-consultations-public` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les procédures de consultation du public sur les projets d'aménagement doivent être raccourcies.
# Motif : « Raccourcies » ne dit pas si la durée, le nombre d'étapes ou les délais de recours sont concernés.
- id: democratie-raccourcir-consultations-public-v2
  text: "La durée des procédures de consultation du public sur les projets d'aménagement doit être réduite."
  themes:
    - democratie
  polarity: "-"
  status: draft
  author: claude
- id: democratie-supprimer-cndp
  text: La Commission nationale du débat public doit être supprimée.
  themes:
    - democratie
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
