# Banque de questions, thème principal « democratie » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: democratie-referendum-initiative-citoyenne
  text: Un référendum d'initiative citoyenne doit pouvoir être déclenché par une pétition signée par un nombre fixé d'électeurs.
  themes:
    - democratie
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `democratie-referendum-exceptionnel` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le recours au référendum doit rester exceptionnel.
# Motif : « Exceptionnel » est vague et normatif ; préciser le principe de limitation.
- id: democratie-referendum-exceptionnel-v2
  text: "Le recours au référendum national doit être limité à des circonstances définies par la Constitution."
  themes:
    - democratie
  polarity: "-"
  status: draft
  author: claude
- id: democratie-conventions-citoyennes
  text: Des conventions citoyennes tirées au sort doivent être consultées avant les grandes réformes.
  themes:
    - democratie
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `democratie-assemblees-tirees-consultatives` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les assemblées citoyennes tirées au sort doivent conserver un rôle uniquement consultatif.
# Motif : « Conserver » présuppose un statut actuel ; la reformulation exprime le choix institutionnel.
- id: democratie-assemblees-tirees-consultatives-v2
  text: "Les assemblées citoyennes tirées au sort doivent avoir un rôle consultatif et non décisionnel."
  themes:
    - democratie
  polarity: "-"
  status: draft
  author: claude
- id: democratie-vote-blanc-exprime
  text: Le vote blanc doit être pris en compte dans les suffrages exprimés.
  themes:
    - democratie
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `democratie-referendum-reserve-elus` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La décision de convoquer un référendum doit rester réservée au président de la République et au Parlement.
# Motif : La version initiale peut être comprise comme exigeant une décision conjointe ; préciser l'alternative institutionnelle.
- id: democratie-referendum-reserve-elus-v2
  text: "Le déclenchement d'un référendum national doit rester de la compétence du président de la République ou du Parlement."
  themes:
    - democratie
    - institutions
  polarity: "-"
  status: draft
  author: claude
- id: democratie-referendum-local-initiative
  text: Les habitants d'une commune doivent pouvoir imposer l'organisation d'un référendum local par une pétition.
  themes:
    - democratie
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `democratie-budget-participatif-communes` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Chaque commune de plus de 10 000 habitants doit consacrer une part de son budget à des projets choisis par les habitants.
# Motif : « Une part de son budget » ne distingue pas fonctionnement et investissement ; préciser l'assiette.
- id: democratie-budget-participatif-communes-v2
  text: "Les communes de plus de 10 000 habitants doivent consacrer une part de leur budget d'investissement à des projets choisis par les habitants."
  themes:
    - democratie
  polarity: +
  status: draft
  author: claude
- id: democratie-referendum-revocatoire
  text: Les électeurs doivent pouvoir révoquer un élu en cours de mandat par référendum.
  themes:
    - democratie
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: democratie-vote-16-ans
  text: Le droit de vote doit être accordé dès 16 ans.
  themes:
    - democratie
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
