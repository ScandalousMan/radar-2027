# Banque de questions, thème principal « justice » (FR-008 à FR-012).
# Première tranche en brouillon (draft) : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: justice-peines-minimales-recidive
  text: Des peines minimales doivent être rétablies pour les récidivistes.
  themes:
    - justice
  polarity: +
  status: draft
  author: adrien
- id: justice-courtes-peines-alternatives
  text: Les peines de prison de moins d'un an doivent être remplacées par des peines alternatives.
  themes:
    - justice
  polarity: "-"
  status: draft
  author: adrien
- id: justice-majorite-penale-16-ans
  text: La majorité pénale doit être abaissée à 16 ans.
  themes:
    - justice
  polarity: +
  status: draft
  author: adrien
- id: justice-arret-construction-prisons
  text: La construction de nouvelles places de prison doit être arrêtée.
  themes:
    - justice
  polarity: "-"
  status: draft
  author: adrien
- id: justice-supprimer-reductions-automatiques
  text: Les réductions automatiques de peine doivent être supprimées.
  themes:
    - justice
  polarity: +
  status: draft
  author: adrien
- id: justice-accompagnement-emploi-detenus
  text: Les détenus doivent bénéficier d'un accompagnement vers l'emploi pendant toute leur détention.
  themes:
    - justice
    - travail
  polarity: "-"
  status: draft
  author: adrien
