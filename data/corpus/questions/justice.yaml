# Banque de questions, thème principal « justice » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: justice-peines-minimales-recidive
  text: Des peines minimales doivent être rétablies pour les récidivistes.
  themes:
    - justice
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: justice-courtes-peines-alternatives
