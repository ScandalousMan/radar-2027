- id: justice-supprimer-reductions-automatiques
  text: Les réductions automatiques de peine doivent être supprimées.
  themes:
    - justice
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `justice-accompagnement-emploi-detenus` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les détenus doivent bénéficier d'un accompagnement vers l'emploi pendant toute leur détention.
# Motif : Le sujet porte sur la réinsertion, donc p− est cohérent, mais l'axe « peines plus orientées vers la réinsertion » ne résume pas à lui seul la politique pénitentiaire.
# P! : polarité ou thème à trancher en seconde passe.
- id: justice-accompagnement-emploi-detenus-v2
  text: "Les personnes détenues doivent bénéficier d'un accompagnement vers l'emploi pendant leur détention."
  themes:
    - justice
    - travail
  polarity: "-"
  status: draft
  author: claude
- id: justice-perpetuite-reelle-etendue
  text: La réclusion à perpétuité sans possibilité de libération doit s'appliquer à davantage de crimes.
  themes:
    - justice
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: justice-comparution-immediate-mineurs
  text: Les mineurs de plus de 16 ans doivent pouvoir être jugés en comparution immédiate.
  themes:
    - justice
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `justice-detenus-frais-incarceration` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les détenus doivent participer financièrement à leurs frais d'incarcération.
# Motif : La contribution financière n'est pas directement une peine plus sévère ni une orientation vers la réinsertion ; l'item est mal positionné sur l'axe Justice.
# P! : polarité ou thème à trancher en seconde passe.
- id: justice-detenus-frais-incarceration-v2
  text: "Les personnes détenues doivent contribuer financièrement aux frais liés à leur incarcération, selon leurs ressources."
  themes:
    - justice
  polarity: +
  status: draft
  author: claude
- id: justice-liberation-conditionnelle-deux-tiers
  text: La libération conditionnelle doit être réservée aux détenus ayant purgé au moins les deux tiers de leur peine.
  themes:
    - justice
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `justice-imprescriptibilite-crimes-sexuels-mineurs` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les crimes sexuels commis sur des mineurs doivent être imprescriptibles.
# Motif : Le terme « crimes sexuels » est imprécis en droit pénal ; « infractions criminelles » est plus précis. L'imprescriptibilité mesure la prescription, pas directement la sévérité de la peine.
# P! : polarité ou thème à trancher en seconde passe.
- id: justice-imprescriptibilite-crimes-sexuels-mineurs-v2
  text: "Les infractions criminelles à caractère sexuel commises sur des mineurs doivent être imprescriptibles."
  themes:
    - justice
  polarity: +
  status: draft
  author: claude
# Reformulation de `justice-sanction-financiere-parents` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les parents de mineurs délinquants doivent pouvoir être sanctionnés financièrement.
# Motif : La sanction des parents n'est pas une peine prononcée contre l'auteur et ne se place pas clairement sur l'axe réinsertion/sévérité des peines.
# P! : polarité ou thème à trancher en seconde passe.
- id: justice-sanction-financiere-parents-v2
  text: "Les parents d'un mineur reconnu coupable d'une infraction doivent pouvoir faire l'objet d'une sanction financière dans des conditions définies par la loi."
  themes:
    - justice
    - societe
  polarity: +
  status: draft
  author: claude
- id: justice-plafonner-detenus-places
  text: Le nombre de détenus doit être plafonné au nombre de places de prison disponibles.
  themes:
    - justice
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: justice-tig-delits-sans-violence
  text: Le travail d'intérêt général doit être préféré à la prison pour les délits commis sans violence.
  themes:
    - justice
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: justice-justice-restaurative-systematique
  text: La justice restaurative doit être proposée systématiquement aux victimes et aux auteurs d'infractions.
  themes:
    - justice
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `justice-juridictions-mineurs-specialisees` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les mineurs doivent continuer à être jugés par des juridictions distinctes de celles des majeurs.
# Motif : La spécialisation juridictionnelle ne correspond pas nécessairement à la réinsertion ou aux alternatives à la prison ; item à sortir de l'axe Justice actuel ou axe à élargir.
# P! : polarité ou thème à trancher en seconde passe.
- id: justice-juridictions-mineurs-specialisees-v2
  text: "Les mineurs doivent continuer à relever de juridictions spécialisées distinctes de celles des majeurs."
  themes:
    - justice
  polarity: "-"
  status: draft
  author: claude
# Reformulation de `justice-visites-familiales-prisons` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Toutes les prisons doivent permettre des visites familiales prolongées sans surveillance directe.
# Motif : Les conditions de visite relèvent des droits en détention, pas directement de la nature des peines ; p− n'est pas une polarité valide sur l'axe actuel.
# P! : polarité ou thème à trancher en seconde passe.
- id: justice-visites-familiales-prisons-v2
  text: "Les établissements pénitentiaires doivent permettre des visites familiales prolongées dans des espaces garantissant l'intimité."
  themes:
    - justice
  polarity: "-"
  status: draft
  author: claude
