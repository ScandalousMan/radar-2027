# Reformulation de `environnement-gazole-non-routier-agriculteurs` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les agriculteurs doivent conserver un taux réduit de taxe sur le gazole non routier.
# Motif : L'item mesure une préférence fiscale sectorielle, pas directement le niveau de contraintes environnementales ; le classement Environnement et la polarité sont à revoir.
# P! : polarité ou thème à trancher en seconde passe.
- id: environnement-gazole-non-routier-agriculteurs-v2
  text: "Le taux réduit de fiscalité applicable au gazole non routier utilisé par les agriculteurs doit être maintenu."
  themes:
    - environnement
    - agriculture
  polarity: "-"
  status: draft
  author: claude
# Reformulation de `environnement-limiter-recours-projets` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les recours contre les projets industriels doivent être limités pour accélérer leur réalisation.
# Motif : « Pour accélérer leur réalisation » donne une justification à la mesure et peut orienter la réponse ; supprimer cette finalité évaluative.
- id: environnement-limiter-recours-projets-v2
  text: "Les possibilités de recours juridictionnel contre les autorisations de projets industriels doivent être limitées."
  themes:
    - environnement
    - economie
  polarity: "-"
  status: draft
  author: claude
