# Banque de questions, thème principal « societe » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

# Reformulation de `societe-aide-active-a-mourir` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'aide active à mourir doit être autorisée pour les adultes atteints d'une maladie incurable.
# Motif : « Maladie incurable » ne décrit pas à elle seule les critères possibles d'accès ; le périmètre légal est décisif et peut déplacer les réponses.
- id: societe-aide-active-a-mourir-v2
  text: "L'aide à mourir doit être autorisée en France sous des conditions définies par la loi."
  themes:
    - societe
    - sante
  polarity: +
  status: draft
  author: claude
