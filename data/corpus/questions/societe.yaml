# Reformulation de `societe-salles-consommation-drogue` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les salles de consommation de drogue à moindre risque doivent être généralisées.
# Motif : « À moindre risque » est une qualification de politique publique ; « supervisée » décrit plus directement le dispositif. « Généralisées » est imprécis.
- id: societe-salles-consommation-drogue-v2
  text: "Des salles de consommation supervisée de drogues doivent être ouvertes dans davantage de villes."
  themes:
    - societe
    - sante
  polarity: +
  status: draft
  author: claude
# Reformulation de `societe-statut-beau-parent` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le beau-parent doit pouvoir obtenir un statut juridique lui donnant des droits sur l'enfant de son conjoint.
# Motif : « Des droits sur l'enfant » est imprécis et réducteur ; droits et devoirs doivent être distingués. La portée du statut est à définir.
- id: societe-statut-beau-parent-v2
  text: "Un beau-parent doit pouvoir obtenir un statut juridique lui donnant certains droits et devoirs à l'égard de l'enfant de son conjoint."
  themes:
    - societe
  polarity: +
  status: draft
  author: claude
