# Reformulation de `fiscalite-baisse-ir-tranches-intermediaires` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'impôt sur le revenu doit baisser pour les tranches intermédiaires.
# Motif : « Tranches intermédiaires » n'a pas de définition stable sans seuils ; ajouter des seuils ou une référence explicite au barème.
- id: fiscalite-baisse-ir-tranches-intermediaires-v2
