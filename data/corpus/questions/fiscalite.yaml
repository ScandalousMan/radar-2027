# Reformulation de `fiscalite-tranche-hauts-revenus` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les plus hauts revenus doivent être soumis à une tranche d'impôt supplémentaire.
# Motif : « Plus hauts revenus » ne fixe aucun seuil ; la mesure est incomparablement interprétable selon les répondants.
- id: fiscalite-tranche-hauts-revenus-v2
  text: "Une tranche supplémentaire d'impôt sur le revenu doit être créée au-delà d'un seuil de revenu fixé par la loi."
  themes:
    - fiscalite
  polarity: +
  status: draft
  author: claude
- id: fiscalite-supprimer-impots-production
  text: Les impôts de production payés par les entreprises doivent être supprimés.
  themes:
    - fiscalite
    - economie
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `fiscalite-impot-minimum-grandes-fortunes` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les patrimoines supérieurs à 100 millions d'euros doivent être soumis à un impôt minimum de 2 % par an.
# Motif : Préciser qu'il s'agit du patrimoine net et de l'assiette ; le niveau de 2 % est très spécifique et mérite un contrôle de cohérence avec les propositions réellement présentes dans le débat.
- id: fiscalite-impot-minimum-grandes-fortunes-v2
  text: "Les patrimoines nets supérieurs à 100 millions d'euros doivent être soumis à un prélèvement annuel minimal de 2 %."
  themes:
    - fiscalite
  polarity: +
  status: draft
  author: claude
# Reformulation de `fiscalite-taxe-benefices-exceptionnels` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les bénéfices exceptionnels des grandes entreprises doivent être soumis à une taxe supplémentaire.
# Motif : « Exceptionnels » et « grandes entreprises » ne sont pas définis ; éviter de faire dépendre la réponse d'une appréciation subjective.
- id: fiscalite-taxe-benefices-exceptionnels-v2
  text: "Les bénéfices des grandes entreprises dépassant un seuil défini doivent être soumis à un prélèvement supplémentaire."
  themes:
    - fiscalite
    - economie
  polarity: +
  status: draft
  author: claude
# Reformulation de `fiscalite-csg-progressive` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La CSG doit devenir progressive en fonction du revenu.
# Motif : La CSG comporte déjà des situations de taux et d'exonération différenciées ; la version actuelle pourrait laisser croire qu'elle est uniformément proportionnelle dans tous les cas.
- id: fiscalite-csg-progressive-v2
  text: "Le taux de la contribution sociale généralisée doit varier en fonction du revenu."
  themes:
    - fiscalite
  polarity: +
  status: draft
  author: claude
- id: fiscalite-hausse-taxe-transactions-financieres
  text: Le taux de la taxe sur les transactions financières doit être relevé.
  themes:
