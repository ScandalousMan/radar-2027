# Reformulation de `fiscalite-reduire-credits-impot` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le montant total des réductions et crédits d'impôt doit être diminué de moitié.
# Motif : Le périmètre « total » et les bénéficiaires ne sont pas précisés ; la mesure pourrait toucher des dispositifs très différents.
- id: fiscalite-reduire-credits-impot-v2
  text: "Le montant total des réductions et crédits d'impôt accordés aux ménages doit être réduit de moitié."
  themes:
    - fiscalite
  polarity: +
  status: draft
  author: claude
- id: fiscalite-heures-sup-sans-plafond
  text: Les heures supplémentaires doivent être exonérées d'impôt sur le revenu sans plafond.
