# Reformulation de `defense-troupes-ukraine-cessez-le-feu` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La France doit être prête à déployer des troupes en Ukraine pour garantir un cessez-le-feu.
# Motif : « Garantir un cessez-le-feu » est une finalité très large qui présuppose la capacité de garantie ; préciser le cadre du déploiement.
- id: defense-troupes-ukraine-cessez-le-feu-v2
  text: "La France doit être prête à déployer des militaires en Ukraine dans le cadre d'un accord de cessez-le-feu."
  themes:
    - defense
    - international
  polarity: +
  status: draft
  author: claude
