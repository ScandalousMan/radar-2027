# Reformulation de `defense-controle-exportations-armes` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les exportations d'armes françaises doivent être soumises à un contrôle parlementaire préalable.
# Motif : Le contrôle parlementaire porte sur la gouvernance et la transparence, pas directement sur le niveau de dépense ou d'engagement militaire ; la polarité − n'est pas justifiée.
# P! : polarité ou thème à trancher en seconde passe.
- id: defense-controle-exportations-armes-v2
  text: "Les exportations d'armes françaises doivent être soumises à l'approbation préalable du Parlement."
  themes:
    - defense
  polarity: "-"
  status: draft
  author: claude
- id: defense-effectifs-armees-hausse
