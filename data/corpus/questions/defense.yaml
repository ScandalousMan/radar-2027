# Reformulation de `defense-dissuasion-protection-europe` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La dissuasion nucléaire française doit couvrir explicitement la protection des autres pays européens.
# Motif : « Couvrir la protection » est peu précis ; la question concerne une doctrine de garantie, non un déploiement matériel.
- id: defense-dissuasion-protection-europe-v2
  text: "La France doit étendre explicitement sa doctrine de dissuasion nucléaire à la protection de ses partenaires européens."
  themes:
    - defense
    - international
  polarity: +
  status: draft
  author: claude
