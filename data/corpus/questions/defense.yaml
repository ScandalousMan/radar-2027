# Reformulation de `defense-livret-a-industrie-defense` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'épargne du livret A doit pouvoir financer l'industrie de défense.
# Motif : La formulation est compréhensible mais touche à l'affectation de l'épargne réglementée, pas seulement au budget militaire ; conserver si cet enjeu est voulu.
- id: defense-livret-a-industrie-defense-v2
