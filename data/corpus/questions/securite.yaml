    both-ends-defensible: true
# Reformulation de `securite-manifestations-sans-declaration` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les manifestations doivent pouvoir se tenir sans déclaration préalable en préfecture.
# Motif : La déclaration relève de la liberté de manifestation et du pouvoir administratif ; la polarité ne mesure pas directement les moyens/pouvoirs des forces de l'ordre.
# P! : polarité ou thème à trancher en seconde passe.
- id: securite-manifestations-sans-declaration-v2
  text: "Les manifestations sur la voie publique doivent pouvoir être organisées sans déclaration préalable en préfecture."
  themes:
    - securite
    - democratie
  polarity: "-"
  status: draft
  author: claude
