# Reformulation de `securite-enquetes-policiers-independantes` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les enquêtes visant des policiers doivent être confiées à un organisme indépendant du ministère de l'Intérieur.
# Motif : L'indépendance du contrôle ne signifie pas nécessairement moins de moyens ou de pouvoirs policiers. Ne pas coder automatiquement en p− sur l'axe actuel.
# P! : polarité ou thème à trancher en seconde passe.
- id: securite-enquetes-policiers-independantes-v2
  text: "Les enquêtes portant sur des faits susceptibles d'être imputés à des policiers doivent être confiées à une autorité indépendante du ministère de l'Intérieur."
  themes:
    - securite
    - justice
  polarity: "-"
  status: draft
  author: claude
- id: securite-restreindre-tirs-refus-obtemperer
  text: Les règles d'usage des armes à feu par les policiers lors des refus d'obtempérer doivent être restreintes.
  themes:
    - securite
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `securite-renseignement-autorisation-juge` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les techniques de renseignement doivent être soumises à l'autorisation préalable d'un juge.
# Motif : Il s'agit d'un contrôle juridictionnel préalable, pas simplement d'une diminution des moyens policiers ; polarité à revoir.
# P! : polarité ou thème à trancher en seconde passe.
- id: securite-renseignement-autorisation-juge-v2
  text: "La mise en œuvre des techniques de renseignement doit être soumise à l'autorisation préalable d'un juge."
  themes:
    - securite
    - numerique
  polarity: "-"
  status: draft
  author: claude
# Reformulation de `securite-limiter-dissolution-associations` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le pouvoir du gouvernement de dissoudre des associations par décret doit être limité.
# Motif : L'énoncé concerne le pouvoir exécutif sur les associations, pas les moyens ou pouvoirs des forces de l'ordre ; mauvais rattachement à l'axe Sécurité.
# P! : polarité ou thème à trancher en seconde passe.
- id: securite-limiter-dissolution-associations-v2
  text: "Les motifs permettant au gouvernement de dissoudre une association par décret doivent être restreints."
  themes:
    - securite
  polarity: "-"
  status: draft
  author: claude
- id: securite-interdire-drones-manifestations
  text: L'usage de drones par la police pour surveiller les manifestations doit être interdit.
  themes:
    - securite
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
