# Banque de questions, thème principal « securite » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: securite-reconnaissance-faciale-police
  text: La reconnaissance faciale en temps réel doit être autorisée dans l'espace public pour la police.
  themes:
    - securite
    - numerique
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `securite-recepisse-controles-identite` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les contrôles d'identité doivent donner lieu à la remise d'un récépissé.
# Motif : Cette mesure relève surtout de la traçabilité et des garanties procédurales, pas directement de « moins de moyens et de pouvoirs » policiers. Polarité à revoir ou axe Sécurité à élargir.
# P! : polarité ou thème à trancher en seconde passe.
- id: securite-recepisse-controles-identite-v2
  text: "Toute personne faisant l'objet d'un contrôle d'identité doit pouvoir recevoir un récépissé."
  themes:
    - securite
  polarity: "-"
  status: draft
  author: claude
- id: securite-hausse-effectifs-police
  text: Les effectifs de police et de gendarmerie doivent augmenter d'au moins 10 % sur le quinquennat.
  themes:
    - securite
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: securite-interdire-lbd-manifestations
  text: L'usage des lanceurs de balles de défense doit être interdit lors des manifestations.
  themes:
    - securite
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: securite-pouvoirs-polices-municipales
  text: Les polices municipales doivent recevoir les mêmes pouvoirs d'enquête que la police nationale.
  themes:
    - securite
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `securite-budget-vers-prevention` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Une partie du budget des forces de l'ordre doit être réorientée vers la prévention de la délinquance.
# Motif : La polarité « moins de moyens et de pouvoirs » est approximative : le volume budgétaire peut rester inchangé ; l'énoncé mesure une réallocation.
# P! : polarité ou thème à trancher en seconde passe.
- id: securite-budget-vers-prevention-v2
  text: "Une part du budget consacré aux forces de l'ordre doit être transférée vers des actions de prévention de la délinquance."
  themes:
    - securite
  polarity: "-"
  status: draft
  author: claude
