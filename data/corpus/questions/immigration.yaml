    single-claim: true
    both-ends-defensible: true
# Reformulation de `immigration-regularisation-metiers-tension` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les travailleurs sans titre de séjour employés dans des métiers en tension doivent pouvoir être régularisés.
# Motif : « Métiers en tension » dépend d'une liste évolutive ; préciser la référence juridique et distinguer droit de demander et droit d'obtenir.
- id: immigration-regularisation-metiers-tension-v2
  text: "Les personnes étrangères sans titre de séjour travaillant dans un métier inscrit sur la liste des métiers en tension doivent pouvoir demander une régularisation."
  themes:
    - immigration
    - travail
  polarity: +
  status: draft
  author: claude
- id: immigration-supprimer-droit-du-sol
  text: Le droit du sol doit être supprimé pour l'acquisition de la nationalité française.
  themes:
    - immigration
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `immigration-vote-local-etrangers` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les étrangers non européens résidant en France depuis plusieurs années doivent pouvoir voter aux élections locales.
# Motif : « Depuis plusieurs années » est indéfini ; préciser durée, régularité du séjour et type d'élection.
- id: immigration-vote-local-etrangers-v2
  text: "Les étrangers non ressortissants de l'Union européenne résidant régulièrement en France depuis au moins cinq ans doivent pouvoir voter aux élections municipales."
  themes:
    - immigration
    - democratie
  polarity: +
  status: draft
  author: claude
- id: immigration-ame-soins-urgents
  text: L'aide médicale d'État doit être limitée aux soins urgents.
  themes:
    - immigration
    - sante
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `immigration-titre-sejour-longue-duree` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les étrangers en situation régulière doivent obtenir plus facilement un titre de séjour de longue durée.
# Motif : « Plus facilement » ne décrit pas le changement souhaité ; la reformulation reste à préciser selon le type de titre concerné.
- id: immigration-titre-sejour-longue-duree-v2
  text: "Les étrangers en situation régulière doivent pouvoir obtenir un titre de séjour pluriannuel après une durée de résidence réduite."
  themes:
    - immigration
  polarity: +
  status: draft
  author: claude
# Reformulation de `immigration-reduire-duree-naturalisation` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : La durée de résidence exigée pour demander la naturalisation doit être réduite.
# Motif : La version initiale est compréhensible, mais ne distingue pas durée de résidence, conditions d'assimilation et décision de naturalisation.
- id: immigration-reduire-duree-naturalisation-v2
  text: "La durée minimale de résidence exigée avant une demande de naturalisation doit être réduite."
  themes:
    - immigration
  polarity: +
  status: draft
  author: claude
- id: immigration-voies-legales-travail-ue
  text: L'Union européenne doit ouvrir davantage de voies d'immigration légale pour le travail.
  themes:
    - immigration
    - international
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
- id: immigration-frais-etudiants-etrangers
  text: Les étudiants étrangers hors Union européenne doivent payer les mêmes frais d'inscription que les étudiants français.
  themes:
    - immigration
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
    no-person-or-party: true
    single-claim: true
    both-ends-defensible: true
# Reformulation de `immigration-regularisation-cinq-ans` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les étrangers sans titre de séjour présents en France depuis plus de cinq ans doivent pouvoir être régularisés.
# Motif : Distinguer le droit de déposer une demande de l'obtention automatique d'un titre.
- id: immigration-regularisation-cinq-ans-v2
  text: "Les personnes étrangères sans titre de séjour présentes en France depuis au moins cinq ans doivent pouvoir demander une régularisation."
  themes:
    - immigration
  polarity: +
  status: draft
  author: claude
# Reformulation de `immigration-visas-professions-qualifiees` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les visas de travail pour les professions qualifiées doivent être délivrés plus facilement.
# Motif : « Plus facilement » est vague ; la reformulation désigne l'assouplissement des conditions.
- id: immigration-visas-professions-qualifiees-v2
  text: "Les conditions de délivrance des visas de travail aux personnes exerçant des professions qualifiées doivent être assouplies."
  themes:
    - immigration
    - travail
  polarity: +
  status: draft
  author: claude
- id: immigration-plafond-annuel-admissions
  text: Le Parlement doit fixer chaque année un plafond du nombre d'étrangers admis au séjour.
  themes:
    - immigration
  polarity: "-"
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
