# Reformulation de `immigration-condamnes-perte-titre-sejour` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les étrangers condamnés à une peine de prison ferme doivent perdre leur titre de séjour.
# Motif : « Doivent perdre » rend la conséquence automatique ; « pouvoir entraîner » distingue automaticité et pouvoir d'appréciation. Le seuil de gravité mérite d'être défini.
- id: immigration-condamnes-perte-titre-sejour-v2
  text: "Une condamnation à une peine d'emprisonnement ferme doit pouvoir entraîner le retrait du titre de séjour d'une personne étrangère."
  themes:
    - immigration
    - justice
  polarity: "-"
  status: draft
  author: claude
# Reformulation de `immigration-asile-examen-hors-europe` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les demandes d'asile doivent être examinées dans des centres situés hors du territoire européen.
# Motif : « Hors du territoire européen » est géographiquement ambigu : Europe géographique, UE ou territoire français.
- id: immigration-asile-examen-hors-europe-v2
  text: "Les demandes d'asile déposées auprès des autorités françaises doivent pouvoir être examinées dans des centres situés hors du territoire de l'Union européenne."
  themes:
    - immigration
    - international
  polarity: "-"
  status: draft
  author: claude
