    single-claim: true
    both-ends-defensible: true
# Reformulation de `numerique-telephone-interdit-lycees` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : L'usage du téléphone portable doit être interdit dans l'enceinte des lycées.
# Motif : « Dans l'enceinte » peut inclure espaces extérieurs ; préciser le périmètre et les exceptions.
- id: numerique-telephone-interdit-lycees-v2
  text: "L'utilisation des téléphones portables doit être interdite dans les locaux des lycées, sauf exceptions définies par le règlement."
  themes:
    - numerique
    - societe
  polarity: +
  status: draft
  author: claude
# Reformulation de `numerique-donnees-sante-hebergeurs-europeens` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les données de santé des Français doivent être hébergées exclusivement par des entreprises européennes.
# Motif : « Entreprises européennes » désigne la nationalité du fournisseur plutôt que la localisation et la juridiction de l'hébergement.
- id: numerique-donnees-sante-hebergeurs-europeens-v2
  text: "Les données de santé des personnes prises en charge en France doivent être hébergées dans l'Union européenne."
  themes:
    - numerique
    - sante
  polarity: +
  status: draft
  author: claude
