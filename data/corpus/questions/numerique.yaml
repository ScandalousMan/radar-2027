# Banque de questions, thème principal « numerique » (FR-008 à FR-012).
# Brouillons (draft) rédigés par `claude` : activation après relecture par une personne distincte
# de l'auteur et grille de neutralité cochée (campagne éditoriale, T094).

- id: numerique-reseaux-sociaux-moins-15-ans
  text: L'accès aux réseaux sociaux doit être interdit aux moins de 15 ans.
  themes:
    - numerique
  polarity: +
  status: draft
  author: claude
- id: numerique-assouplir-regles-ia
  text: Les règles européennes encadrant l'intelligence artificielle doivent être assouplies.
  themes:
    - numerique
  polarity: "-"
  status: draft
  author: claude
- id: numerique-taxe-plateformes
  text: Les grandes plateformes numériques doivent payer un impôt sur le chiffre d'affaires réalisé en France.
  themes:
    - numerique
    - fiscalite
  polarity: +
  status: draft
  author: claude
- id: numerique-anonymat-en-ligne
  text: L'anonymat en ligne doit être préservé sur les réseaux sociaux.
  themes:
    - numerique
  polarity: "-"
  status: draft
  author: claude
- id: numerique-logiciels-libres-administration
  text: Les administrations doivent utiliser en priorité des logiciels libres ou hébergés en Europe.
  themes:
    - numerique
  polarity: +
  status: draft
  author: claude
- id: numerique-chiffrement-messageries
  text: Le chiffrement des messageries privées doit rester hors d'atteinte des autorités.
  themes:
    - numerique
    - securite
  polarity: "-"
  status: draft
  author: claude
- id: numerique-algorithmes-publics
  text: Les plateformes doivent rendre publics les algorithmes qui hiérarchisent les contenus.
  themes:
    - numerique
  polarity: +
  status: draft
  author: claude
- id: numerique-telephone-interdit-lycees
  text: L'usage du téléphone portable doit être interdit dans l'enceinte des lycées.
  themes:
    - numerique
    - societe
  polarity: +
  status: draft
  author: claude
- id: numerique-donnees-sante-hebergeurs-europeens
  text: Les données de santé des Français doivent être hébergées exclusivement par des entreprises européennes.
  themes:
    - numerique
    - sante
  polarity: +
  status: draft
  author: claude
- id: numerique-scission-grandes-plateformes
  text: L'Union européenne doit pouvoir imposer la scission des grandes plateformes numériques en position dominante.
  themes:
    - numerique
    - economie
  polarity: +
  status: draft
  author: claude
- id: numerique-ia-remuneration-auteurs
  text: Les entreprises d'intelligence artificielle doivent rémunérer les auteurs dont les œuvres servent à entraîner leurs modèles.
  themes:
    - numerique
  polarity: +
  status: draft
  author: claude
- id: numerique-faciliter-centres-donnees
  text: L'implantation de centres de données doit bénéficier de procédures administratives accélérées.
  themes:
    - numerique
    - environnement
  polarity: "-"
  status: draft
  author: claude
- id: numerique-alleger-moderation
  text: Les obligations de modération imposées aux réseaux sociaux doivent être allégées.
  themes:
    - numerique
  polarity: "-"
  status: draft
  author: claude
- id: numerique-assouplir-consentement-traceurs
  text: Les règles de consentement aux traceurs publicitaires sur internet doivent être assouplies.
  themes:
    - numerique
  polarity: "-"
  status: draft
  author: claude
- id: numerique-rgpd-petites-entreprises
  text: Les petites entreprises doivent être exemptées d'une partie des obligations du règlement sur la protection des données.
  themes:
    - numerique
    - economie
  polarity: "-"
  status: draft
  author: claude
- id: numerique-responsabilite-plateformes-limitee
  text: La responsabilité des plateformes pour les contenus publiés par leurs utilisateurs doit rester limitée.
  themes:
    - numerique
  polarity: "-"
  status: draft
  author: claude
- id: numerique-donnees-publiques-entrainement-ia
  text: Les entreprises doivent pouvoir utiliser librement les données publiques pour entraîner des modèles d'intelligence artificielle.
  themes:
    - numerique
  polarity: "-"
  status: draft
  author: claude
