# Reformulation de `numerique-logiciels-libres-administration` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Les administrations doivent utiliser en priorité des logiciels libres ou hébergés en Europe.
# Motif : La formulation combine deux critères différents : logiciel libre et hébergement en Europe. Il faut choisir l'un, ou créer deux énoncés distincts.
- id: numerique-logiciels-libres-administration-v2
  text: "Les administrations doivent privilégier les logiciels libres."
  themes:
    - numerique
  polarity: +
  status: draft
  author: claude
# Reformulation de `numerique-chiffrement-messageries` proposée par la relecture du 2026-11-09, endossée par adrien.
# Ancien texte : Le chiffrement des messageries privées doit rester hors d'atteinte des autorités.
# Motif : « Hors d'atteinte » est imagé et imprécis ; préciser le type d'accès et le périmètre technique.
- id: numerique-chiffrement-messageries-v2
  text: "Les autorités publiques ne doivent pas pouvoir accéder au contenu des messages privés protégés par un chiffrement de bout en bout."
  themes:
    - numerique
    - securite
  polarity: "-"
  status: draft
  author: claude
- id: numerique-algorithmes-publics
  text: Les plateformes doivent rendre publics les algorithmes qui hiérarchisent les contenus.
  themes:
    - numerique
  polarity: +
  status: draft
  author: claude
  neutralityChecklist:
    no-loaded-term: true
    no-presupposition: true
