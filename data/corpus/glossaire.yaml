# Glossaire des termes techniques employés dans les énoncés (spec 009, data-model § 7, règle GLOSS).
# Inventaire initial rédigé par l'agent le 2026-11-22 (dossier : data/relectures/2026-11-22-glossaire.md).
# Chaque définition est factuelle, neutre, d'au plus 280 caractères, et repose sur une source
# institutionnelle ouverte et vérifiée à la date indiquée. Seuls les termes `reviewed` (relus par
# une personne différente de l'auteur) sont publiés par `pnpm data:glossary`.
# Ajouter un terme en fin de liste ; `forms` liste les formes telles qu'elles figurent dans les énoncés.
- id: aide-medicale-etat
