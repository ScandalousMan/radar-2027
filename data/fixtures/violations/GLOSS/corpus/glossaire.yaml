# Fixture de violation GLOSS : définition de plus de 280 caractères (theme-economie) et conflit
# de forme entre deux termes (« thème Santé » déclarée par theme-sante et par sante-bis).
- id: theme-economie
  label: thème Économie
  forms:
    - thème Économie
  definition: Terme fictif dont la définition dépasse volontairement la limite de deux cent quatre-vingts caractères fixée par la règle GLOSS, pour vérifier que la validation refuse le terme et désigne son identifiant ; une définition de glossaire doit rester courte, factuelle et neutre, lisible d'un coup d'œil dans la bulle de définition.
  sources:
    - url: https://www.vie-publique.fr/fiches/exemple-economie
      title: Fiche fictive
      publisher: Vie-publique.fr
      accessedAt: 2026-11-22
  status: draft
  author: adrien
