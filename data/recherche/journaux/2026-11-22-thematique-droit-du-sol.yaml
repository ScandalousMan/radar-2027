request: >-
  Recherche thématique limitée à la question immigration-supprimer-droit-du-sol (« Le droit du sol
  doit être supprimé pour l'acquisition de la nationalité française. », polarité -) et à deux
  personnalités publiées, Édouard Philippe (edouard-philippe) et Gabriel Attal (gabriel-attal).
  Chercher des preuves dans les deux sens de l'énoncé (soutien à la suppression et opposition, ou
  restriction partielle comme à Mayotte), consigner des requêtes des deux sens pour chaque
  personnalité. Créer leur entrée au registre avec leur statut publié, appuyé par une preuve
  CANDIDACY sur leur source de statut (VERIFIED_QUOTE seulement si retrouvée mot pour mot dans le
  cache). Mission bornée (1 à 3 preuves par personnalité). Validation d'installation (T041) : pas
  d'enrichissement global, pas de commit, aucune modification des questions, thèmes, positions ni
  de la liste des candidats.
