      instrument.
  - kind: NOT_FOUND
    personality: gabriel-attal
    theme: immigration
    question: immigration-vote-local-etrangers-v2
    note: >-
      Rien trouvé après recherches presse, site de campagne, compte rendu de la déclaration de
      politique générale et scrutins de la 17e législature (aucun scrutin public sur le droit de vote
      des étrangers dans ses intitulés).
  - kind: NOT_FOUND
