  - kind: HISTORICAL_ONLY
    personality: gabriel-attal
    theme: immigration
    question: immigration-ame-soins-urgents
    evidence: [gabriel-attal-immigration-004]
    note: >-
      Seul propos personnel retrouvé : déclaration de politique générale du 30 janvier 2024 (réforme
      réglementaire sur la base du rapport Evin-Stefanini). La restitution Renaissance de mai 2025
      (« Réformer l'AME en mettant en œuvre les recommandations du rapport Evin-Stefanini ») est une
      position de parti. Votes éventuels sur des amendements budgétaires relatifs à l'AME non vérifiés.
