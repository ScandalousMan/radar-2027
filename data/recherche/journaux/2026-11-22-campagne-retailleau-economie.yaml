    title: STX France, Retailleau (LR) appelle à ce que « l'Etat rouvre le dossier » (Public Sénat, 29 mai 2017)
    outcome: retained
    source: bruno-retailleau-publicsenat-stx-2017-05
  - url: https://www.publicsenat.fr/actualites/politique/rejet-du-ceta-par-le-senat-un-message-envoye-a-la-commission-europeenne-se-felicite-bruno-retailleau
    title: Rejet du CETA par le Sénat, « Un message envoyé à la Commission européenne » (Public Sénat, 21 mars 2024)
    outcome: rejected
    reason: >-
      Propos rapportés le jour même, contexte non précisé ; le compte rendu officiel de la séance
      (source primaire) a été préféré. Contient « Oui au libre-échange, mais pas pour supprimer
      nos éleveurs », non retrouvé dans le compte rendu (sans doute un propos hors hémicycle).
  - url: https://www.publicsenat.fr/actualites/politique/mercosur-un-accord-destructeur-et-une-capitulation-environnementale-denonce-bruno
    title: Mercosur, un accord « destructeur » et une « capitulation environnementale » (Public Sénat, 4 juillet 2019)
    outcome: rejected
    reason: Propos de 2019 sur un accord précis, antérieurs et moins directs que le compte rendu de 2024 ; non enregistré.
  - url: https://www.brut.media/fr/articles/retailleau-previent-si-macron-vote-pour-le-mercosur-il-prend-le-risque-dune-censure-du-gouvernement
    title: Retailleau prévient, si Macron vote pour le Mercosur, « il prend le risque d'une censure » (Brut)
    outcome: rejected
    reason: >-
      Corps de l'article non rendu sans JavaScript ; seul le chapeau (dépêche, « mercredi »,
      conférence de presse) est lisible ; date affichée incohérente avec le vote du Conseil de
      janvier 2026. Cité en contexte seulement.
  - url: https://www.europe1.fr/node/875297
    title: Article Europe 1 sur Retailleau et le Mercosur (« favorable au libre-échange », vu en extrait de moteur)
    outcome: inaccessible
    reason: HTTP 403 (blocage des clients automatisés), non contourné ; l'extrait de moteur n'est pas une preuve.
  - url: https://www.publicsenat.fr/actualites/non-classe/stx-france-retailleau-souhaite-que-salaries-et-sous-traitants-rentrent-au-capital
    title: STX France, Retailleau souhaite que salariés et sous-traitants « rentrent au capital » (Public Sénat, 28 juillet 2017)
    outcome: rejected
    reason: Porte sur l'actionnariat des salariés et sous-traitants, pas sur une participation de l'État.
  - url: https://www.publicsenat.fr/actualites/politique/essence-energie-logement-travail-bruno-retailleau-promet-daugmenter-le-pouvoir-dachat-des-francais-sans-un-euro-de-dette-en-plus
    title: Essence, énergie, logement, travail, Bruno Retailleau promet d'augmenter le pouvoir d'achat (Public Sénat, 15 septembre 2026)
    outcome: rejected
    reason: Aucune déclaration sur la réglementation des prix de l'énergie, EDF ou les aides aux entreprises.
  - url: https://www.publicsenat.fr/actualites/politique/marche-europeen-de-lelectricite-sortie-ou-reforme-les-paradoxes-de-la-normalisation-du-rn
    title: Marché européen de l'électricité, sortie ou réforme (Public Sénat, 23 avril 2026)
    outcome: rejected
    reason: >-
      Message sur X (« une fausse piste qui ne ferait pas baisser les prix ») contre la sortie du
      marché européen proposée par le RN ; ne porte pas sur la réglementation des prix par
      l'État ; original sur X non consulté.
  - url: https://www.publicsenat.fr/article/parlementaire/pas-de-nationalisation-le-texte-contre-un-demembrement-d-edf-a-ete-denature-au
    title: Le texte contre un « démembrement d'EDF » adopté au Sénat (Public Sénat, avril 2023)
    outcome: rejected
    reason: Position du rapporteur et du groupe LR au Sénat ; M. Retailleau n'y est ni cité ni intervenant.
