    parents résident à Mayotte de façon régulière et ininterrompue depuis au moins un an (contre un
    seul parent et trois mois auparavant) ; un amendement adopté en séance a porté la durée à trois
    ans, contre l'avis du Gouvernement et du rapporteur. Le texte ne concerne que Mayotte. Sur le
    scrutin n° 698 du même jour (amendement n° 87 de M. Ciotti, rédaction globale de l'article
    unique, rejeté), Attal figure dans la liste « Contre » ; le contenu de cet amendement n'a pas pu
    être lu (PDF illisible), aucune conclusion n'en est tirée.
